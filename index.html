        const ADMIN_AUTH_KEY = 'nav_admin_auth';

        const ADMIN_TIMEOUT_MS = 30 * 60 * 1000;
        let adminActivityTimer = null;

        function isAdminAuthenticated() {
            return localStorage.getItem(ADMIN_AUTH_KEY) === 'true';
        }

        function getAdminLastActivity() {
            const value = Number(localStorage.getItem(ADMIN_LAST_ACTIVITY_KEY) || 0);
            return Number.isFinite(value) ? value : 0;
        }

        function markAdminActivity() {
            if (!isAdminAuthenticated()) return;
            localStorage.setItem(ADMIN_LAST_ACTIVITY_KEY, String(Date.now()));
            scheduleAdminTimeout();
        }

        function scheduleAdminTimeout() {
            if (adminActivityTimer) {
                clearTimeout(adminActivityTimer);
                adminActivityTimer = null;
            }
            if (!isAdminAuthenticated()) return;
            const last = getAdminLastActivity();
            const remaining = ADMIN_TIMEOUT_MS - (Date.now() - last);
            if (remaining <= 0) {
                expireAdminSession();
                return;
            }
            adminActivityTimer = setTimeout(() => {
                if (isAdminAuthenticated() && Date.now() - getAdminLastActivity() >= ADMIN_TIMEOUT_MS) {
                    expireAdminSession();
                } else {
                    scheduleAdminTimeout();
                }
            }, Math.max(1000, remaining + 50));
        }

        function expireAdminSession() {
            localStorage.removeItem(ADMIN_AUTH_KEY);
            localStorage.removeItem(ADMIN_LAST_ACTIVITY_KEY);
            isCustomLinksExpanded = false;
            expandedDynamicSections = {};
            if (adminActivityTimer) clearTimeout(adminActivityTimer);
            adminActivityTimer = null;
            checkAdminSession();
            document.getElementById('theme-panel').classList.add('hidden');
        }

        function checkAdminSession() {
            const last = getAdminLastActivity();
            if (isAdminAuthenticated() && (!last || Date.now() - last >= ADMIN_TIMEOUT_MS)) {
                expireAdminSession();
                return;
            }
            const isAdmin = isAdminAuthenticated();
            const loginBtn = document.getElementById('admin-login-btn');
            const logoutBtn = document.getElementById('admin-logout-btn');
            const panelBtn = document.getElementById('admin-panel-open-btn');
            const badge = document.getElementById('admin-badge');
            const hint = document.getElementById('admin-status-hint');
            if (isAdmin) {
                document.body.classList.add('is-admin');
                setTimeout(() => { renderManagedCategories(); renderDynamicSections(); renderAdminPanel(); }, 0);
                if (badge) badge.classList.remove('hidden');
                if (hint) hint.classList.remove('hidden');
                if (loginBtn) loginBtn.classList.add('hidden');
                if (logoutBtn) logoutBtn.classList.remove('hidden');
                if (panelBtn) panelBtn.classList.remove('hidden');
                scheduleAdminTimeout();
            } else {
                document.body.classList.remove('is-admin');
                if (badge) badge.classList.add('hidden');
                if (hint) hint.classList.add('hidden');
                if (loginBtn) loginBtn.classList.remove('hidden');
                if (logoutBtn) logoutBtn.classList.add('hidden');
                if (panelBtn) panelBtn.classList.add('hidden');
                const panel = document.getElementById('v14-admin-panel'); if (panel) panel.classList.add('hidden');
                if (adminActivityTimer) clearTimeout(adminActivityTimer);
                adminActivityTimer = null;
            }
        }

            box.innerHTML=rows.length?rows.map((s,i)=>`<div class="v14-admin-row"><div class="min-w-0"><strong>${escapeHtml(s.name)}</strong><div class="text-[11px] text-slate-400 truncate">${escapeHtml(s.category)}${s.subcategory?' / '+escapeHtml(s.subcategory):''}</div><small class="text-slate-500 break-all">${escapeHtml(s.url)}</small></div><div class="flex gap-1.5 items-center shrink-0"><span class="${s.status==='bad'?'v14-bad':s.status==='good'?'v14-good':'text-slate-400'} text-[11px]">${s.status==='bad'?escapeHtml(t('unreachable')):s.status==='good'?escapeHtml(t('reachable')):escapeHtml(t('unknown'))}</span><button type="button" class="text-sky-400" onclick="adminEditRow(${i})" aria-label="${escapeHtml(t('edit'))}: ${escapeHtml(s.name)}"><i class="fas fa-pen"></i></button><button type="button" class="text-red-400" onclick="adminDeleteRow(${i})" aria-label="${escapeHtml(t('delete'))}: ${escapeHtml(s.name)}"><i class="fas fa-trash"></i></button></div></div>`).join(''):`<div class="text-sm text-slate-400 p-4">${escapeHtml(t('noSites'))}</div>`;
            const catsBox=document.getElementById('v14-admin-categories'); if(catsBox){const cats=getManagedCategories();catsBox.innerHTML=cats.map(c=>`<div class="v14-admin-row"><div><strong>${escapeHtml(c.title)}</strong><div class="text-[11px] text-slate-500">${(c.groups||[]).reduce((n,g)=>n+(g.links||[]).length,0)} 个网址 · ${(c.groups||[]).length} 个子分类</div></div><div class="flex gap-2"><button type="button" class="text-emerald-400" onclick="addSubcategory('${c.id}')">子分类+</button><button type="button" class="text-sky-400" onclick="editCategory('${c.id}')">${escapeHtml(t('edit'))}</button><button type="button" class="text-red-400" onclick="deleteCategory('${c.id}')">${escapeHtml(t('delete'))}</button></div></div>`).join('')||`<div class="p-4 text-sm text-slate-400">${escapeHtml(t('noCategories'))}</div>`;}
            const check=document.getElementById('v14-check-results');if(check)check.innerHTML=rows.map(s=>`<div class="v14-admin-row"><div><strong>${escapeHtml(s.name)}</strong><div class="text-[11px] text-slate-500">${escapeHtml(s.url)}</div></div><span class="${s.status==='bad'?'v14-bad':s.status==='good'?'v14-good':'text-slate-400'}">${s.status==='bad'?escapeHtml(t('unreachable')):s.status==='good'?escapeHtml(t('reachable')):escapeHtml(t('unknown'))}</span></div>`).join('')||`<div class="p-4 text-sm text-slate-400">${escapeHtml(t('noSites'))}</div>`;
        }
        async function adminEditRow(i){const rows=flattenCloudSites();const custom=await getCustomCloudLinks();custom.forEach((l,idx)=>rows.push({type:'custom',linkIdx:idx,name:l.name,url:l.url}));const s=rows[i];if(!s)return;if(s.type==='managed')editManagedLink(s.catId,0,s.groupIdx,s.linkIdx);else if(s.type==='dynamic')editDynamicLink(s.secId,s.linkIdx);else if(s.type==='friend')editFriendLink({preventDefault(){},stopPropagation(){}},s.linkIdx);else editCustomLink({preventDefault(){},stopPropagation(){}},s.linkIdx);}
        async function adminDeleteRow(i){const rows=flattenCloudSites();const custom=await getCustomCloudLinks();custom.forEach((l,idx)=>rows.push({type:'custom',linkIdx:idx,name:l.name,url:l.url}));const s=rows[i];if(!s)return;if(s.type==='managed')deleteManagedLink(s.catId,s.groupIdx,s.linkIdx);else if(s.type==='dynamic')deleteSectionLink({preventDefault(){},stopPropagation(){}},s.secId,s.linkIdx);else if(s.type==='friend')deleteFriendLink({preventDefault(){},stopPropagation(){}},s.linkIdx);else deleteCustomLink({preventDefault(){},stopPropagation(){}},s.linkIdx);}
        async function v14ScanSites(){
            if(!isAdminAuthenticated())return; const rows=flattenCloudSites(); const custom=await getCustomCloudLinks();custom.forEach(l=>rows.push({type:'custom',name:l.name,url:l.url,status:(cloudConfig.linkStatuses||{})[l.url]||'unknown'})); const status=cloudConfig.linkStatuses||{};
            for(const s of rows){status[s.url]='checking';renderAdminPanel();try{await fetch(s.url,{method:'HEAD',mode:'no-cors',cache:'no-store'});status[s.url]='good';}catch(e){status[s.url]='bad';}cloudConfig.linkStatuses=status;}
            await updateCloudConfig('linkStatuses',status);renderAdminPanel();
        }
        async function removeBadSites(){const bad=flattenCloudSites().filter(s=>s.status==='bad');const custom=await getCustomCloudLinks();custom.forEach((l,i)=>{if((cloudConfig.linkStatuses||{})[l.url]==='bad')bad.push({type:'custom',linkIdx:i,name:l.name,url:l.url});});if(!bad.length)return alert('当前没有检测为无法连接的网址。');if(!confirm(`${t('removeBad')}：${bad.length}？`))return;const managedByCat={};bad.slice().reverse().forEach(s=>{if(s.type==='managed'){const c=getCategoryById(s.catId);if(c&&c.groups[s.groupIdx])c.groups[s.groupIdx].links.splice(s.linkIdx,1);}else if(s.type==='dynamic'){const sec=(cloudConfig.dynamicSections||[]).find(x=>x.id===s.secId);if(sec)sec.links.splice(s.linkIdx,1);}else if(s.type==='friend'){cloudConfig.friendLinks.splice(s.linkIdx,1);}});await saveManagedCategories();await updateCloudConfig('dynamicSections',cloudConfig.dynamicSections);await updateCloudConfig('friendLinks',cloudConfig.friendLinks);for(const s of bad.filter(x=>x.type==='custom').sort((a,b)=>b.linkIdx-a.linkIdx)){let links=await getCustomCloudLinks();links.splice(s.linkIdx,1);await fetch('/api/links',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(links)});}renderManagedCategories();renderDynamicSections();loadFriendLinks();loadCustomLinks();renderAdminPanel();}
        function showAdminTab(tab){adminPanelTab=tab;document.querySelectorAll('.v14-tab-panel').forEach(el=>el.classList.add('hidden'));const el=document.getElementById('v14-tab-'+tab);if(el)el.classList.remove('hidden');document.querySelectorAll('.v14-admin-tab').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===tab?'true':'false'));renderAdminPanel();}
        function addAdminSite(){if(!getManagedCategories().length)return addManagedCategory();openManagedLinkModal(getManagedCategories()[0].id,0);}

        function clearSiteSearchHighlights() { document.querySelectorAll('.site-search-highlight').forEach(el => { el.classList.remove('site-search-highlight'); el.style.outline = ''; el.style.outlineOffset = ''; el.style.backgroundColor = ''; el.style.borderRadius = ''; }); } document.getElementById('search-form').addEventListener('submit', function(e) { 
            if (currentEngineKey === 'site') { 
                e.preventDefault(); 
                const query = document.getElementById('search-input').value.trim().toLowerCase();
                const box = document.getElementById('site-search-results');
                box.innerHTML = '';
                if (!query) { box.classList.add('hidden'); return; }
                const allLinks = [...document.querySelectorAll('a[href]:not([href="#"]):not([href=""]):not([href^="javascript"])')];
                const found = allLinks.filter(link => {
                    const text = link.textContent.trim().toLowerCase();
                    const href = (link.getAttribute('href') || '').toLowerCase();
                    return text.includes(query) || href.includes(query);
                });
                if (!found.length) {
                    box.innerHTML = '<div class="text-sm text-slate-400">未找到匹配的网址。</div>';
                } else {
                    box.innerHTML = '<div class="text-sm font-bold mb-3 text-indigo-400">找到 '+found.length+' 个结果</div>' +
                    found.map(link => `<a target="_blank" href="${link.href}" class="block p-2 rounded-lg hover:bg-indigo-500/20 text-sm"><span class="font-medium">${link.textContent.trim()}</span><span class="block text-xs text-slate-400 truncate">${link.href}</span></a>`).join('');
                }
                box.classList.remove('hidden');
            } 
        }); 
        document.addEventListener('click', () => { document.getElementById('engine-menu').classList.add('hidden'); document.getElementById('theme-panel').classList.add('hidden'); });
        checkAdminSession(); document.documentElement.lang = currentLang === 'zh' ? 'zh-CN' : 'en'; applyLanguage(); updateClockAndGreeting(); fetchWeather(); initCloudData();
    </script>

<!-- v14 全站云端后台管理面板 -->
<style>
#v14-admin-panel{display:none;position:fixed;inset:5rem 1rem 1rem;z-index:200;background:rgba(15,23,42,.97);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(99,102,241,.25);border-radius:20px;overflow:auto;padding:20px;color:#fff;max-width:1100px;margin-left:auto;box-shadow:0 25px 70px rgba(0,0,0,.45)}

<div id="v14-admin-panel" role="dialog" aria-modal="false" aria-labelledby="v14-admin-title">

<script>
/* v14 无障碍第二轮优化：动态内容辅助识别 */
(function(){
    function enhanceAccessibility(){
        document.querySelectorAll('img').forEach(function(img){
            if(!img.getAttribute('alt')) img.setAttribute('alt','图片');
        });
        document.querySelectorAll('button').forEach(function(btn){
            if(!btn.getAttribute('aria-label') && !btn.textContent.trim()){
                btn.setAttribute('aria-label','操作按钮');
            }
        });
        document.querySelectorAll('input').forEach(function(input){
            if(!input.getAttribute('aria-label') && input.placeholder){
                input.setAttribute('aria-label',input.placeholder);
            }
        });
        var menu=document.getElementById('engine-menu');
        if(menu){
            menu.setAttribute('role','menu');
            menu.querySelectorAll('button').forEach(function(item){
                item.setAttribute('role','menuitem');
            });
        }
        var main=document.querySelector('main');
        if(main) main.setAttribute('role','main');
    }
    if(document.readyState==='loading'){
        document.addEventListener('DOMContentLoaded',enhanceAccessibility);
    }else{
        enhanceAccessibility();
    }
})();

// v14 无障碍第三轮增强
(function(){
 const engineBtn=document.getElementById('engine-btn');
 const engineMenu=document.getElementById('engine-menu');
 if(engineBtn&&engineMenu){
  const oldToggle=window.toggleEngineMenu;
  window.toggleEngineMenu=function(e){
   if(oldToggle) oldToggle(e);
   const expanded=!engineMenu.classList.contains('hidden');
   engineBtn.setAttribute('aria-expanded',String(expanded));
  };
 }
 document.addEventListener('keydown',function(e){
  if(e.key==='Escape') {
   document.getElementById('engine-menu')?.classList.add('hidden');
   document.getElementById('theme-panel')?.classList.add('hidden');
  }
 });
})();
</script>

<!-- v14 第六轮无障碍最终验收增强：动态状态播报与键盘菜单支持 -->
<div id="accessibility-status" class="sr-only" aria-live="polite" aria-atomic="true"></div>
<script>
(function(){
  const status = document.getElementById('accessibility-status');
  const announce = (text) => { if(!status) return; status.textContent=''; requestAnimationFrame(()=>{ status.textContent=text; }); };
  const engineBtn = document.getElementById('engine-btn');
  const engineMenu = document.getElementById('engine-menu');
  if(engineBtn && engineMenu){
    const items = Array.from(engineMenu.querySelectorAll('button[role="menuitem"]'));
    items.forEach((item, i) => {
      item.setAttribute('tabindex','-1');
      item.addEventListener('keydown', function(e){
        let next=-1;
        if(e.key==='ArrowDown') next=(i+1)%items.length;
        else if(e.key==='ArrowUp') next=(i-1+items.length)%items.length;
        else if(e.key==='Home') next=0;
        else if(e.key==='End') next=items.length-1;
        else if(e.key==='Escape'){ engineMenu.classList.add('hidden'); engineBtn.setAttribute('aria-expanded','false'); engineBtn.focus(); return; }
        if(next>=0){ e.preventDefault(); items[next].focus(); }
      });
      item.addEventListener('click', function(){
        items.forEach(x=>x.setAttribute('aria-current','false'));
        item.setAttribute('aria-current','true');
        announce('已切换搜索引擎：'+item.textContent.trim());
        engineBtn.setAttribute('aria-expanded','false');
      });
    });
    engineBtn.addEventListener('keydown', function(e){
      if(e.key==='ArrowDown' || e.key==='Enter' || e.key===' '){
        e.preventDefault();
        engineMenu.classList.remove('hidden');
        engineBtn.setAttribute('aria-expanded','true');
        if(items.length) items[0].focus();
      }
      if(e.key==='Escape'){ engineMenu.classList.add('hidden'); engineBtn.setAttribute('aria-expanded','false'); }
    });
  }
  document.addEventListener('keydown', function(e){
    if(e.key==='Escape' && engineMenu && !engineMenu.classList.contains('hidden')){
      engineMenu.classList.add('hidden');
      if(engineBtn){ engineBtn.setAttribute('aria-expanded','false'); engineBtn.focus(); }
    }
  });
})();
</script>
